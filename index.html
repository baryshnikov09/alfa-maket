<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Альфа конверты — планируйте расходы и копите на цель">
  <meta name="theme-color" content="#FFFFFF">
  <title>Альфа конверты</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="board-state.js"></script>
  <script defer src="app.js"></script>
  <script defer src="board.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">К содержимому</a>
  <div class="bank-app"><header class="app-header bank-header">
      <button class="bank-identity" type="button" data-bank-placeholder="Профиль"><span class="bank-alpha" aria-hidden="true">А</span><span>Альфа-Онлайн</span></button>
      <nav class="primary-nav" aria-label="Разделы банка"><button type="button" data-bank-placeholder="Главная"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Главная</span></button><button type="button" data-bank-placeholder="Платежи"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15m-6-6 6 6-6 6"/></svg><span>Платежи</span></button><button type="button" data-bank-placeholder="Выгода"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>Выгода</span></button><button type="button" data-bank-placeholder="История"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg><span>История</span></button><button type="button" data-bank-placeholder="Чаты"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a9 9 0 0 1-9 9 10 10 0 0 1-4-.9L3 21l1.4-4.7A9 9 0 1 1 21 11.5Z"/></svg><span>Чаты</span></button></nav>
      <button type="button" class="bank-game-launch" data-action="open-game"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3Zm0 0 9 7 9-7"/></svg><span>Игровой стол</span></button>
      <button class="bank-avatar" type="button" data-bank-placeholder="Профиль" aria-label="Профиль Александра">АК</button>
    </header>
    <div class="app-shell"><aside class="sidebar" aria-label="Мои продукты">
      <section class="bank-summary"><span class="eyebrow">Мои продукты</span><h2>Общий баланс</h2><strong>120 000 ₽</strong><div class="bank-product-list">
      <button type="button" data-bank-placeholder="Карты"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1 14H6Zm3 0V5a4 4 0 0 1 8 0v2"/></svg><span>Карты<small>Альфа-Карта · 0000</small></span></button>
      <button type="button" data-bank-placeholder="Накопления"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span>Накопления<small>Вклады и счета</small></span></button>
      <button type="button" data-bank-placeholder="Настройки банка"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Настройки<small>Личные данные</small></span></button>
      </div></section><p class="demo-caption">Демонстрационный прототип</p>
    </aside><main id="main-content" class="page-content" tabindex="-1"><noscript>Для игры включите JavaScript в браузере.</noscript></main></div>
    <footer class="prototype-footer"><span>Альфа конверты · Демонстрационный прототип</span><a href="#help" data-view="help">Об игре</a></footer>
  </div>
  <dialog class="message-dialog" id="demo-message" aria-labelledby="message-title"><div class="dialog-heading"><h2 id="message-title">Демонстрационный режим</h2><button type="button" class="icon-button" data-close-dialog aria-label="Закрыть">×</button></div><p data-message-content></p><button class="btn btn-primary" type="button" data-close-dialog>Понятно</button></dialog>
  <div role="status" aria-live="polite" class="toast" hidden></div>
</body></html>
